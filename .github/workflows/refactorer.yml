name: RefactorerLM demo

on:
  workflow_dispatch:

jobs:
  refactor:
    uses: jbpextra/RefactorerLM/.github/workflows/refactorer.yml@main
    with:
      project_install_command: python -m pip install -r requirements-dev.txt
    permissions:
      contents: write
      pull-requests: write
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
